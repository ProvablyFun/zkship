[package]
name = "zkb-core"
description = "Zero-Knowledge Battleship: cryptographic core (parameters, Pedersen commitments, Bulletproofs, squaring Sigma protocol, setup proof, shot answers, game logic)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
curve25519-dalek.workspace = true
merlin.workspace = true
sha2.workspace = true
rand_core.workspace = true
zeroize.workspace = true
subtle.workspace = true

# wasm32: OsRng/getrandom needs the WebCrypto backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
